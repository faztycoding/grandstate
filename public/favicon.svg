<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gGrad" x1="30" y1="25" x2="70" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="50" y1="60" x2="70" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <!-- Subtle ring -->
  <rect x="4" y="4" width="92" height="92" rx="19" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.15"/>
  <!-- G letter -->
  <text x="50" y="68" text-anchor="middle" font-size="60" font-weight="800" font-family="Inter, system-ui, sans-serif" fill="url(#gGrad)">G</text>
  <!-- Accent dot -->
  <circle cx="68" cy="55" r="5" fill="url(#accentGrad)"/>
</svg>
